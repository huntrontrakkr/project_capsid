[project]
name = "capsid"
version = "0.1.0"
description = "Rules engine, board generator, and self-play experiments for project_capsid"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "jax[cuda12]>=0.4.30",
    "flax>=0.8",
    "optax>=0.2",
    "mctx>=0.0.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capsid"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
