<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Necklaces on the 12-gon</title><link rel="stylesheet" href="style.css">
<style>
.v{cursor:pointer}
.mono{font-family:var(--font-mono);color:var(--text-primary);letter-spacing:1px}
.lg{display:flex;align-items:center;gap:8px;cursor:pointer;padding:3px 6px;border-radius:var(--radius);border:.5px solid transparent}
.lg.on{background:var(--surface-1);border-color:var(--border-strong)}
</style></head><body><main>
<h1>12-gon projection colored by necklace</h1>
<p class="note">Each color is one rotation class. Complementary classes share a hue: light has fewer units filled, dark is its open/filled flip. Tap a node or a necklace to highlight its class.</p>
<svg id="g" width="100%" viewBox="0 0 380 400" role="img"><title>Six-cube colored by necklace</title><desc>64 shell states in the 12-gon projection, colored by 14 rotation classes</desc></svg>
<div id="out" style="font-size:13px;color:var(--text-secondary);line-height:1.7;margin:2px 0 8px;min-height:46px">Tap a node or a necklace to highlight its class.</div>
<div id="leg" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 10px;font-size:13px;color:var(--text-secondary)"></div>
<nav><a href="index.html">All graphs</a></nav>
<script>
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg',svg=$('g');
const rot=(s,k)=>{k=((k%6)+6)%6;return k?((s<<k)|(s>>(6-k)))&63:s};
const canon=s=>{let m=s;for(let k=1;k<6;k++)m=Math.min(m,rot(s,k));return m};
const pc=s=>{let c=0;while(s){c+=s&1;s>>=1}return c};
const pat=s=>Array.from({length:6},(_,i)=>(s>>i)&1?'●':'○').join('');
const COL={0:'#B4B2A9',63:'#5F5E5A',1:'#F0997B',31:'#993C1D',3:'#85B7EB',15:'#185FA5',5:'#5DCAA5',23:'#0F6E56',9:'#AFA9EC',27:'#534AB7',7:'#BA7517',21:'#639922',11:'#ED93B1',13:'#993556'};
const ORDER=[0,1,3,5,9,7,11,13,21,15,23,27,31,63];
const CL={},SZ={};for(let s=0;s<64;s++){const c=canon(s);CL[s]=c;SZ[c]=(SZ[c]||0)+1}
const P={},raw={},th=i=>(i*30+15)*Math.PI/180;
for(let s=0;s<64;s++){let x=0,y=0;for(let i=0;i<6;i++){const c=((s>>i)&1)-.5;x+=c*Math.cos(th(i));y+=c*Math.sin(th(i))}raw[s]=[x,y];P[s]=[190+88*x,200+88*y]}
const grp={};for(let s=0;s<64;s++){const k=Math.round(raw[s][0]*1000)+','+Math.round(raw[s][1]*1000);(grp[k]=grp[k]||[]).push(s)}
Object.values(grp).forEach(g=>{if(g.length<2)return;const r=g.length>2?11:8.5;g.forEach((s,j)=>{const a=Math.PI/4+2*Math.PI*j/g.length;P[s]=[P[s][0]+r*Math.cos(a),P[s][1]+r*Math.sin(a)]})});
const eg=document.createElementNS(NS,'g');eg.setAttribute('stroke','var(--text-muted)');eg.setAttribute('stroke-width','.6');svg.appendChild(eg);
const E=[];for(let s=0;s<64;s++)for(let i=0;i<6;i++){const t=s^(1<<i);if(s<t){const l=document.createElementNS(NS,'line'),[x1,y1]=P[s],[x2,y2]=P[t],dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,o=Math.min(.45,8.5/L);
 l.setAttribute('x1',(x1+dx*o).toFixed(1));l.setAttribute('y1',(y1+dy*o).toFixed(1));l.setAttribute('x2',(x2-dx*o).toFixed(1));l.setAttribute('y2',(y2-dy*o).toFixed(1));l.setAttribute('stroke-opacity','.4');eg.appendChild(l);E.push([s,t,l])}}
const V=[];for(let s=0;s<64;s++){const c=document.createElementNS(NS,'circle');c.setAttribute('cx',P[s][0].toFixed(1));c.setAttribute('cy',P[s][1].toFixed(1));c.setAttribute('r','8');c.setAttribute('class','v');c.setAttribute('fill',COL[CL[s]]);c.setAttribute('stroke','var(--text-secondary)');c.setAttribute('stroke-width','.75');c.dataset.s=s;svg.appendChild(c);V.push(c)}
$('leg').innerHTML=ORDER.map(c=>`<div class="lg" data-c="${c}"><span style="width:12px;height:12px;flex:none;border-radius:50%;background:${COL[c]};border:.5px solid var(--border-strong)"></span><span class="mono">${pat(c)}</span><span>×${SZ[c]}</span></div>`).join('');
let C=null,S=null;
function paint(){
 V.forEach((c,s)=>{const mem=C!==null&&CL[s]===C;c.setAttribute('opacity',C===null||mem?'1':'.15');
  c.setAttribute('stroke',s===S?'var(--text-accent)':mem?'var(--text-primary)':'var(--text-secondary)');c.setAttribute('stroke-width',s===S?'3':mem?'2':'.75')});
 E.forEach(([a,b,l])=>{const on=S!==null&&(a===S||b===S);l.setAttribute('stroke',on?'#D85A30':'var(--text-muted)');l.setAttribute('stroke-width',on?'2':'.6');l.setAttribute('stroke-opacity',on?'1':C===null?'.4':'.15');if(on)eg.appendChild(l)});
 document.querySelectorAll('.lg').forEach(d=>d.classList.toggle('on',C!==null&&+d.dataset.c===C));
 if(C===null){$('out').innerHTML='Tap a node or a necklace to highlight its class.';return}
 const top=S!==null?`<div><span class="mono">${pat(S)}</span> &nbsp;${pc(S)} filled, ${6-pc(S)} open</div>`:'';
 $('out').innerHTML=top+`<div>Necklace <span class="mono">${pat(C)}</span> · ${SZ[C]} rotation${SZ[C]===1?'':'s'}</div>`}
svg.addEventListener('click',e=>{const c=e.target.closest('.v');if(!c){C=null;S=null;paint();return}const s=+c.dataset.s;if(S===s){S=null;C=null}else{S=s;C=CL[s]}paint()});
$('leg').addEventListener('click',e=>{const d=e.target.closest('.lg');if(!d)return;const c=+d.dataset.c;S=null;C=C===c?null:c;paint()});
paint();
</script>
</main></body></html>
